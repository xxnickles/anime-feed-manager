name: AMF Blazor Web

on:
  push:
    branches: [main]
    paths:
      - 'src/AnimeFeedManager.Web/**'
      - 'src/AnimeFeedManager.Web.BlazorComponents/**'
      - 'src/AnimeFeedManager.Features/**'
      - 'src/AnimeFeedManager.Shared/**'
      - 'src/AnimeFeedManager.Services.Shared/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '!src/**/*.md'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: amf-rg
  DOTNET_VERSION: '10.0.x'
  APP_PATH: './src/AnimeFeedManager.Web'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: src/AnimeFeedManager.Web/package-lock.json

      - name: Build CSS
        working-directory: ${{ env.APP_PATH }}
        run: |
          npm ci
          npm run build:css

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.APP_PATH }}

      - name: Build
        run: dotnet build ${{ env.APP_PATH }} -c Release --no-restore

      - name: Test
        run: |
          dotnet test tests/AnimeFeedManager.Features.Tests -c Release --verbosity normal
          dotnet test tests/AnimeFeedManager.Shared.Tests -c Release --verbosity normal
          dotnet test tests/AnimeFeedManager.Web.BlazorComponents.Tests -c Release --verbosity normal

      - name: Compute version
        id: version
        run: echo "build_version=4.$(date +%y%m).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: dotnet publish ${{ env.APP_PATH }} -c Release -o ./output -p:Version=${{ steps.version.outputs.build_version }}

      - name: Azure Login (OIDC)
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Web App Name
        id: getname
        uses: azure/bicep-deploy@v2.5.0
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          template-file: ./deployment/main-blazor.bicep

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3.0.8
        with:
          app-name: ${{ steps.getname.outputs.webAppName }}
          package: ./output
